<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Timetable</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #faf7f0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #5a4fcf;
            margin-bottom: 25px;
        }

        .table-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            overflow-x: auto; /* IMPORTANT: avoids clipping last column */
        }

        table {
            width: 100%;
            border-collapse: collapse; /* FIXES GRID ISSUE */
            min-width: 1200px;
            border: 1px solid #d8ccff; /* OUTER BORDER */
        }

        th, td {
            border: 1px solid #d8ccff; /* CELL GRID */
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #eee6ff;
            font-weight: bold;
        }

        td:first-child, th:first-child {
            background-color: #f6f2e9;
            font-weight: bold;
            text-align: left;
            padding-left: 10px;
        }
    </style>
</head>
