<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Clubs Status Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
            background-color: #f7f3e9;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        /* ================= SEARCH BAR ================= */
        .search-box {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 60%;
            max-width: 480px;
            padding: 12px 18px 12px 44px;
            border-radius: 999px;
            border: 1px solid #cfc6e6;
            font-size: 1rem;
            outline: none;
            background-color: #ffffff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .search-icon {
            position: absolute;
            left: calc(50% - 240px + 16px);
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            opacity: 0.6;
            pointer-events: none;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
            color: #5b4b8a;
            font-size: 2.6rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        thead {
            background: #e8def8;
        }

        th {
            padding: 18px;
            font-size: 1.05rem;
            color: #3f2d68;
            border: 1px solid #ddd2f3;
            text-align: center;
        }

        td {
            padding: 15px;
            border: 1px solid #eee6d8;
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
        }

        .club-name {
            text-align: left;
            padding-left: 30px;
            background: #faf6ee;
            color: #5e5647;
            font-weight: 600;
        }

        .department {
            background: #f1efe9;
        }

        .neutral {
            background: #f4f1eb;
        }

        tbody tr:hover {
            background: #f5f0e6;
        }

        /* ================= MOBILE RESPONSIVE ================= */
        @media (max-width: 768px) {

            body {
                padding: 20px 10px;
            }

            .search-box input {
                width: 90%;
            }

            .search-icon {
                left: calc(5% + 16px);
            }

            thead {
                display: none;
            }

            table, tbody, tr, td {
                display: block;
                width: 100%;
            }

            tbody tr {
                margin-bottom: 16px;
                background: #ffffff;
                border-radius: 14px;
                box-shadow: 0 6px 18px rgba(0,0,0,0.08);
                overflow: hidden;
            }

            td {
                text-align: left;
                padding: 12px 16px;
                border: none;
                border-bottom: 1px solid #eee;
            }

            td:last-child {
                border-bottom: none;
            }

            td::before {
                content: attr(data-label);
                display: block;
                font-size: 0.75rem;
                font-weight: 600;
                color: #7b6d5d;
                margin-bottom: 4px;
                text-transform: uppercase;
            }

            .club-name {
                background: #f7f3e9;
                font-size: 1.05rem;
                font-weight: 700;
                color: #5b4b8a;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
        </svg>
        <input type="text" placeholder="Search club or department..." onkeyup="filterTable(this.value)" />
    </div>

    <table>
        <thead>
        <tr>
            <th>Club</th>
            <th>Department</th>
            <th>2024</th>
            <th>2026</th>
        </tr>
        </thead>

        <tbody id="clubsTable">
            <tr>
                <td class="club-name" data-label="Club">ACM Student Chapter</td>
                <td class="department" data-label="Department">School of Computing</td>
                <td class="neutral" data-label="2024">NA</td>
                <td class="neutral" data-label="2026">0</td>
            </tr>
            <tr>
                <td class="club-name" data-label="Club">Blockchain – Research Interest Group</td>
                <td class="department" data-label="Department">TIFAC-CORE in Cyber Security</td>
                <td class="neutral" data-label="2024">NA</td>
                <td class="neutral" data-label="2026">0</td>
            </tr>
            <tr>
                <td class="club-name" data-label="Club">Intel IoT</td>
                <td class="department" data-label="Department">Computer Science Engineering</td>
                <td class="neutral" data-label="2024">NA</td>
                <td class="neutral" data-label="2026">3</td>
            </tr>
            <tr>
                <td class="club-name" data-label="Club">Robotics</td>
                <td class="department" data-label="Department">Mechanical Engineering</td>
                <td class="neutral" data-label="2024">NA</td>
                <td class="neutral" data-label="2026">5</td>
            </tr>
            <tr>
                <td class="club-name" data-label="Club">WiCyS Amrita Student Chapter</td>
                <td class="department" data-label="Department">TIFAC-CORE in Cyber Security</td>
                <td class="neutral" data-label="2024">NA</td>
                <td class="neutral" data-label="2026">0</td>
            </tr>
        </tbody>
    </table>

</div>

<script>
function filterTable(query) {
    query = query.toLowerCase();
    document.querySelectorAll("#clubsTable tr").forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(query) ? "" : "none";
    });
}
</script>

</body>
</html>
