<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Anokha TechFair & Exhibitions 2026 – Status Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
            background-color: #f7f3e9;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: #5b4b8a;
            margin-bottom: 30px;
            min-height: 3.2rem;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 12px 32px;
            border-radius: 25px;
            border: none;
            background-color: #dcd6f7;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: #5b4b8a;
            color: white;
        }

        iframe {
            width: 100%;
            min-height: 70vh;
            border: none;
            border-radius: 16px;
            background: white;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
        }

         .footer {
            margin-top: 40px;
            padding: 18px 10px;
            text-align: center;
            font-size: 0.95rem;
            color: #5e5647;
            background: #efe4d2;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;   /* size matching screenshot */
            height: 20px;
            pointer-events: none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="images/anokha_2026.png" width="320" />
        <img src="images/tf_black.png" width="290" />
        <img src="images/iic_logo.png" width="300" />
    </div>
</header>

<div class="container">
    <h1 id="typing-text"></h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="loadPage('techfair.html', this)">
            Departments
        </button>
        <button class="tab-btn" onclick="loadPage('clubs.html', this)">
            Clubs
        </button>
    </div>

    <iframe id="contentFrame" src="techfair.html"></iframe>
</div>

<footer class="footer">
    © 2024–2026 <strong>IIC</strong> & <strong>Anokha TechFair</strong>
</footer>

<script>
    const text = "Anokha TechFair 2026 – Status Tracker";
    let index = 0;

    function typeWriter() {
        if (index < text.length) {
            document.getElementById("typing-text").innerHTML += text.charAt(index++);
            setTimeout(typeWriter, 80);
        }
    }

    function loadPage(page, btn) {
        document.getElementById("contentFrame").src = page;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
    }

    window.onload = typeWriter;
</script>

</body>
</html>
