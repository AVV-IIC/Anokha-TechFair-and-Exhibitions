<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anokha TechFair & Exhibitions 2026 – Status Tracker</title>

    <style>
        /* =========================
           RESET
           ========================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
            background-color: #f7f3e9;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            text-align: center;
        }

        /* =========================
           LOGOS
           ========================= */
        .logo-container {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        /* =========================
           HEADING (Typing Style)
           ========================= */
        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: #5b4b8a;
            margin-bottom: 35px;
            min-height: 3.2rem;
        }

        /* =========================
           TABS
           ========================= */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 12px 32px;
            border-radius: 25px;
            border: none;
            background-color: #dcd6f7;
            color: #333;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background-color: #b8b0e6;
        }

        .tab-btn.active {
            background-color: #5b4b8a;
            color: #ffffff;
        }

        /* =========================
           IFRAME CONTENT
           ========================= */
        .iframe-wrapper {
            width: 100%;
        }

        .iframe-wrapper iframe {
            width: 100%;
            min-height: 70vh;
            border: none;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            transition: height 0.2s ease;
        }

        /* =========================
           FOOTER
           ========================= */
        .footer {
            margin-top: 40px;
            padding: 18px 10px;
            text-align: center;
            font-size: 0.95rem;
            color: #5e5647;
            background: #efe4d2;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           RESPONSIVE
           ========================= */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .tab-btn {
                padding: 10px 24px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER LOGOS
         ========================= -->
    <header>
        <div class="logo-container">
            <img src="images/anokha_2026.png" alt="Anokha Logo" width="320" />
            <img src="images/tf_black.png" alt="TechFair & Exhibitions Logo" width="290" />
            <img src="images/iic_logo.png" alt="IIC Logo" width="300" />
        </div>
    </header>

    <div class="container">

        <!-- Typing Heading -->
        <h1 id="typing-text"></h1>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="loadPage('techfair.html', this)">
                Departments
            </button>
            <button class="tab-btn" onclick="loadPage('clubs.html', this)">
                Clubs
            </button>
        </div>

        <!-- Content -->
        <div class="iframe-wrapper">
            <iframe id="contentFrame" src="techfair.html"></iframe>
        </div>

    </div>

    <!-- =========================
         FOOTER
         ========================= -->
    <footer class="footer">
        © 2024–2026
        <strong>Institution’s Innovation Council (IIC)</strong> &
        <strong>Anokha TechFair & Exhibitions</strong>.
        All Rights Reserved.
    </footer>

    <!-- =========================
         SCRIPT
         ========================= -->
    <script>
        /* Typing Effect */
        const text = "Anokha TechFair & Exhibitions 2026 – Status Tracker";
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typing-text").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 100);
            }
        }

        /* Auto-resize iframe */
        function resizeIframe() {
            const iframe = document.getElementById("contentFrame");
            try {
                iframe.style.height =
                    iframe.contentWindow.document.body.scrollHeight + "px";
            } catch (e) {
                iframe.style.height = "1500px"; // fallback
            }
        }

        function loadPage(page, button) {
            const iframe = document.getElementById("contentFrame");
            iframe.src = page;

            iframe.onload = resizeIframe;

            document
                .querySelectorAll(".tab-btn")
                .forEach(btn => btn.classList.remove("active"));

            button.classList.add("active");
        }

        window.onload = () => {
            typeWriter();
            resizeIframe();
        };

        window.addEventListener("resize", resizeIframe);
    </script>

<footer class="footer">
    © 2024–2026 
    <strong>Institution’s Innovation Council (IIC)</strong> & 
    <strong>Anokha TechFair & Exhibitions</strong>. 
    All Rights Reserved.
</footer>
</body>

</html>
