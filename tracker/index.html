<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Anokha TechFair & Exhibitions 2026 – Status Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
            background-color: #f7f3e9;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: #5b4b8a;
            margin-bottom: 30px;
            min-height: 3.2rem;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 12px 32px;
            border-radius: 25px;
            border: none;
            background-color: #dcd6f7;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #5b4b8a;
            color: white;
        }

        /* =========================
           IFRAME – AUTO FIT CONTENT
           ========================= */
        iframe {
            width: 100%;
            border: none;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            transition: height 0.3s ease;
        }

        .footer {
            margin-top: 40px;
            padding: 18px 10px;
            text-align: center;
            font-size: 0.95rem;
            color: #5e5647;
            background: #efe4d2;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="images/anokha_2026.png" width="320" />
        <img src="images/tf_black.png" width="290" />
        <img src="images/iic_logo.png" width="300" />
    </div>
</header>

<div class="container">
    <h1 id="typing-text"></h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="loadPage('techfair.html', this)">
            Departments
        </button>
        <button class="tab-btn" onclick="loadPage('clubs.html', this)">
            Clubs
        </button>
    </div>

    <!-- IMPORTANT: no height here -->
    <iframe
        id="contentFrame"
        src="techfair.html"
        scrolling="no"
        onload="resizeIframe(this)">
    </iframe>
</div>

<footer class="footer">
    © 2024–2026
    <strong>Institution’s Innovation Council (IIC)</strong> &
    <strong>Anokha TechFair & Exhibitions</strong>.
    All Rights Reserved.
</footer>

<script>
    const text = "Anokha TechFair 2026 – Status Tracker";
    let index = 0;

    function typeWriter() {
        if (index < text.length) {
            document.getElementById("typing-text").innerHTML += text.charAt(index++);
            setTimeout(typeWriter, 80);
        }
    }

    function resizeIframe(iframe) {
        try {
            iframe.style.height = "0px"; // reset
            const height = iframe.contentWindow.document.body.scrollHeight;
            iframe.style.height = height + "px";
        } catch (err) {
            console.warn("Iframe resize blocked:", err);
        }
    }

    function loadPage(page, btn) {
        const iframe = document.getElementById("contentFrame");
        iframe.src = page;

        document.querySelectorAll(".tab-btn")
            .forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        iframe.onload = () => resizeIframe(iframe);
    }

    window.onload = typeWriter;
</script>

</body>
</html>
